[project]
name = "lrc-xmp-preview"
version = "0.1.0"
description = "Explicit, partial Python previews of Lightroom XMP settings"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "pillow==13.0.0", "scipy==1.18.1"]

[project.optional-dependencies]
ui = ["streamlit>=1.49,<2"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
